<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />

  <!-- AdSense 高速化: preconnect + preload -->
  <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin />
  <link rel="preconnect" href="https://googleads.g.doubleclick.net" crossorigin />
  <link rel="preconnect" href="https://tpc.googlesyndication.com" crossorigin />
  <link rel="preconnect" href="https://adservice.google.com" crossorigin />
  <link rel="preconnect" href="https://adservice.google.co.jp" crossorigin />
  <link rel="preconnect" href="https://www.googletagservices.com" crossorigin />
  <link rel="dns-prefetch" href="//pagead2.googlesyndication.com" />
  <link rel="dns-prefetch" href="//googleads.g.doubleclick.net" />
  <link rel="dns-prefetch" href="//tpc.googlesyndication.com" />
  <link rel="dns-prefetch" href="//adservice.google.com" />
  <link rel="dns-prefetch" href="//adservice.google.co.jp" />
  <!-- adsbygoogle.js を早めにフェッチ開始（広告表示速度・ビューアビリティ向上） -->
  <link rel="preload"
    href="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2298313897414846" as="script"
    crossorigin="anonymous" />

  <!-- GA4 (gtag.js) の接続を先に張っておく -->
  <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!--
    The Moneytizer の CMP (inmobi choice.js) は契約終了に伴い 2026-07 に撤去。
    同意管理は下の Google Consent Mode v2 のみで行う（日本向けサービスのためバナー不要）。
  -->

  <!--
    Google Consent Mode v2 — デフォルト同意設定
    日本向けサービスのため全てのストレージを 'granted' に設定。
    GDPR対象外なのでバナー不要だが、Google要件に準拠するためv2 APIを実装。
    ※ sveltekit.head より前に置かないと GA4/AdSense より遅れてしまうため
       ここに配置している。
    ※ wait_for_update は同意更新を送ってくる CMP がある場合の待ち時間。
       CMP は 2026-07 に撤去済みで更新が来ないため指定しない
       （指定すると初回ヒットを無駄に遅らせうる）。
  -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }

    // Consent Mode v2 デフォルト: 全て granted（日本向け）
    gtag('consent', 'default', {
      'ad_storage': 'granted',
      'ad_user_data': 'granted',
      'ad_personalization': 'granted',
      'analytics_storage': 'granted',
      'functionality_storage': 'granted',
      'personalization_storage': 'granted',
      'security_storage': 'granted'
    });
  </script>

  <!--
    GA4 (Google タグ) — 初期HTMLの解析時点で初期化する。
    以前は $lib/ga.ts が onMount（＝ハイドレーション完了後）に script を動的注入して
    いたため、gtag.js のダウンロード開始が JS バンドルの取得・実行を待っており、
    セッション最初のヒットが大きく遅れていた（GA4 の
    「セッションの参照元/メディア = (not set)」の主要因）。

    - 測定IDのプレースホルダは hooks.server.js の transformPageChunk が
      $lib/config/analytics.js の GA_MEASUREMENT_ID に置換する。
    - send_page_view:false は維持する。初回・SPA遷移とも page_view の送信は
      +layout.svelte 側で1回ずつ行う（config の自動 page_view との二重計測を防ぐ）。
    - 配置は「consent default より後、SvelteKit の head 差し込みより前」を守ること
      （dataLayer の順序: consent → js → config → event）。

    注意: このコメント内にパーセント記号で囲んだ SvelteKit / 測定IDのプレースホルダを
    書かないこと。置換対象になり、差し込まれたHTMLがコメントを途中で閉じてしまう。
  -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=%ga.measurementId%"></script>
  <script>
    gtag('js', new Date());
    gtag('config', '%ga.measurementId%', { send_page_view: false });
  </script>

  %sveltekit.head%

</head>

<body data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
</body>

</html>
