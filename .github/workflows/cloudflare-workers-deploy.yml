# Cloudflare Workers への手動デプロイ（移行用・将来用）
#
# - 手動実行（workflow_dispatch）のみ。push / schedule では動かない。
# - 既定は「ビルドと dry-run だけ」。deploy=true を選んだときだけ wrangler deploy する。
# - wrangler.jsonc に routes / custom_domain が無いので、デプロイ先は *.workers.dev のみ。
#   本番ドメイン（noutorebiyori.com）の割り当ては切替当日にダッシュボードで行う。
# - 必要な GitHub Secrets（値はここに書かない。NOBU が登録する）:
#     CLOUDFLARE_API_TOKEN   … Workers Scripts:Edit 権限のみのトークン
#     CLOUDFLARE_ACCOUNT_ID
#   実行時の環境変数・シークレット（SANITY_* / SMTP_* / INDEXNOW_KEY / CF_PURGE_API_TOKEN 等）は
#   Cloudflare ダッシュボードか `wrangler secret put` で Worker 側に登録する。
name: Cloudflare Workers deploy (manual)

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'true のときだけ workers.dev へデプロイする（false はビルドと dry-run のみ）'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests (edge cache)
        run: pnpm run test:edge-cache

      - name: Build (Cloudflare)
        run: pnpm run build:cloudflare
        env:
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}

      - name: Dry run
        run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/dry-run

      - name: Deploy to workers.dev
        if: ${{ inputs.deploy }}
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
